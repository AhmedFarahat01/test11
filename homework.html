<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحدي الكيمياء | مسار الشجرة</title>
    <!-- استدعاء خط Cairo -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        /* --- الإعدادات الأساسية --- */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        
        body {
            background: #0f172a;
            background-image: radial-gradient(circle at top right, #1e293b, #0f172a);
            color: #ffffff;
            height: 100vh;
            overflow: hidden; /* لمنع التمرير العام، التمرير سيكون داخل الحاوية */
            display: flex;
            flex-direction: column;
        }

        /* --- الشريط العلوي --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(255,255,255,0.1);
            z-index: 1000;
        }

        .stat-box { display: flex; align-items: center; gap: 8px; font-size: 1.2rem; font-weight: 700; }
        .error-box { color: #fca5a5; }

        .progress-container { flex-grow: 1; max-width: 400px; margin: 0 30px; text-align: center; }
        .progress-text { font-size: 1.1rem; font-weight: 600; margin-bottom: 5px; color: #e2e8f0; }
        .progress-bar-bg { width: 100%; height: 10px; background: rgba(255, 255, 255, 0.1); border-radius: 10px; overflow: hidden; }
        .progress-bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #06b6d4, #3b82f6); transition: width 0.4s ease; }

        .glass-btn {
            background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
            color: white; font-size: 1.2rem; width: 45px; height: 45px;
            border-radius: 50%; cursor: pointer; transition: 0.3s;
        }
        .glass-btn:hover { background: rgba(255,255,255,0.2); }

        /* --- حاوية خريطة الأسئلة (Tree View) --- */
        #quiz-screen {
            flex: 1;
            width: 100vw;
            overflow: auto; /* السماح بالتمرير الأفقي والرأسي */
            display: none; 
            scroll-behavior: smooth;
        }

        #tree-root {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: max-content; /* لمنع ضغط العناصر داخله */
            padding: 40px 100px 150px 100px;
        }

        /* --- تصميم الكروت / العقد (Nodes) --- */
        .node-box {
            border-radius: 12px;
            padding: 15px 25px;
            border: none;
            box-shadow: 10px 10px 0px rgba(0, 0, 0, 0.3); /* ظل جانبي رمادي داكن يطابق التصميم */
            backdrop-filter: blur(8px);
            font-weight: 700;
            text-align: center;
            position: relative;
            z-index: 2;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        /* ألوان مطابقة للصورة المرفقة (Pastel Translucent) */
        .color-0 { background: rgba(100, 230, 255, 0.85); color: #000; } /* سماوي */
        .color-1 { background: rgba(120, 180, 255, 0.85); color: #000; } /* أزرق فاتح */
        .color-2 { background: rgba(180, 120, 255, 0.85); color: #fff; } /* بنفسجي */
        .color-3 { background: rgba(255, 130, 180, 0.85); color: #000; } /* وردي */
        .color-4 { background: rgba(255, 170, 100, 0.85); color: #000; } /* برتقالي */
        .color-5 { background: rgba(255, 240, 100, 0.85); color: #000; } /* أصفر */
        .color-6 { background: rgba(160, 255, 120, 0.85); color: #000; } /* أخضر ليموني */

        .q-node {
            font-size: 1.5rem;
            min-width: 300px;
            max-width: 500px;
            margin: 0 auto;
            border: 2px solid rgba(255,255,255,0.4);
        }

        .opt-btn {
            font-size: 1.1rem;
            cursor: pointer;
            font-family: inherit;
            min-width: 140px;
            outline: none;
            border: 1px solid rgba(255,255,255,0.2);
        }
        
        .opt-btn:not(:disabled):hover {
            transform: translate(-4px, -4px);
            box-shadow: 14px 14px 0px rgba(0, 0, 0, 0.4);
        }

        /* حالات الإجابة */
        .opt-btn.correct { background: #22c55e !important; color: #fff !important; box-shadow: 0 0 20px rgba(34,197,94,0.6), 10px 10px 0px rgba(0,0,0,0.3); border-color:#fff;}
        .opt-btn.wrong { background: #ef4444 !important; color: #fff !important; box-shadow: 0 0 20px rgba(239,68,68,0.6), 10px 10px 0px rgba(0,0,0,0.3); border-color:#fff;}

        /* --- الخطوط المتقطعة للتشعب (Flowchart Lines) --- */
        .tree-level { display: flex; flex-direction: column; align-items: center; }
        
        .connector-line-vertical {
            width: 0; height: 40px;
            border-right: 5px dotted #94a3b8; /* خط متقطع مثل الصورة */
            margin: 0 auto; position: relative; z-index: 1;
        }

        .options-row {
            display: flex;
            flex-wrap: nowrap;
            justify-content: center;
            align-items: flex-start;
        }

        .option-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            padding: 40px 15px 0 15px; /* مسافة للخط العمودي المتجه للزر */
        }

        /* الخط العمودي النازل على كل خيار */
        .option-wrapper::before {
            content: ''; position: absolute; top: 0; right: 50%;
            transform: translateX(50%); height: 40px;
            border-right: 5px dotted #94a3b8; z-index: 1;
        }

        /* الخط الأفقي الواصل بين الخيارات */
        .option-wrapper::after {
            content: ''; position: absolute; top: 0; right: 0;
            width: 100%; border-top: 5px dotted #94a3b8; z-index: 1;
        }
        
        /* تظبيط الخطوط الجانبية (للاتجاه العربي RTL) */
        .option-wrapper:first-child::after { right: 50%; width: 50%; }
        .option-wrapper:last-child::after { right: 0; width: 50%; }

        /* --- الشاشات الثابتة والحركات --- */
        .center-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; justify-content: center; align-items: center;
            z-index: 50; padding: 20px;
            background: #0f172a;
        }
        .hidden { display: none !important; }

        .start-card, .end-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px; padding: 3rem; text-align: center;
            box-shadow: 0 15px 50px rgba(0,0,0,0.5);
            max-width: 600px; width: 100%;
        }

        .title { font-size: 3rem; margin-bottom: 10px; }
        .subtitle { font-size: 1.2rem; color: #cbd5e1; margin-bottom: 30px; }
        .icon-large { font-size: 5rem; margin-bottom: 10px; }

        .btn-primary {
            background: linear-gradient(135deg, #4f46e5, #9333ea); color: white;
            border: none; padding: 15px 40px; font-size: 1.3rem; font-weight: 700;
            border-radius: 50px; cursor: pointer; transition: 0.3s;
            box-shadow: 0 10px 20px rgba(79, 70, 229, 0.4);
        }
        .btn-primary:hover { transform: translateY(-3px) scale(1.05); box-shadow: 0 15px 25px rgba(79, 70, 229, 0.6); }

        .wrong-msg {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(220, 38, 38, 0.95); backdrop-filter: blur(5px);
            color: white; padding: 20px 40px; border-radius: 12px; font-size: 1.5rem; font-weight: 700;
            box-shadow: 0 10px 30px rgba(220, 38, 38, 0.5); z-index: 9999;
            pointer-events: none;
        }

        /* Animations */
        .scale-in { animation: scaleIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1); }
        @keyframes scaleIn { from { opacity: 0; transform: scale(0.5); } to { opacity: 1; transform: scale(1); } }
        
        .fade-in { animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .shake { animation: shake 0.4s ease-in-out; }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-10px); }
            40%, 80% { transform: translateX(10px); }
        }

        .results-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin: 30px 0; }
        .result-box { background: rgba(255,255,255,0.05); padding: 20px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.1); }
        .result-box p { font-size: 2rem; font-weight: 800; color: #fff; }
    </style>
</head>
<body>

    <!-- الشريط العلوي -->
    <header id="top-bar" class="hidden">
        <div class="stat-box">
            <span class="icon">🕒</span>
            <span id="timer">00:00</span>
        </div>
        
        <div class="progress-container">
            <div class="progress-text">السؤال <span id="current-q-num">1</span> / <span id="total-q-num">14</span></div>
            <div class="progress-bar-bg">
                <div id="progress-bar" class="progress-bar-fill"></div>
            </div>
        </div>

        <div class="stat-box error-box">
            <span class="icon">❌</span>
            <span id="error-count">0</span>
        </div>
        <button id="mute-btn" class="glass-btn">🔊</button>
    </header>

    <!-- شاشة البداية -->
    <section id="start-screen" class="center-screen">
        <div class="start-card scale-in">
            <div class="icon-large">🧪</div>
            <h1 class="title">مسار الكيمياء</h1>
            <p class="subtitle">أجب لتبني المخطط.. إذا أخطأت سينهار وتعود للبداية!</p>
            <button id="start-btn" class="btn-primary">ابدأ الاختبار</button>
        </div>
    </section>

    <!-- مساحة شجرة الأسئلة (Flowchart) -->
    <section id="quiz-screen">
        <div id="tree-root">
            <!-- سيتم بناء العقد هنا برمجياً -->
        </div>
    </section>

    <!-- رسالة الخطأ العائمة -->
    <div id="wrong-msg" class="wrong-msg hidden">إجابة خاطئة... ابدأ من جديد ❌</div>

    <!-- شاشة النهاية -->
    <section id="end-screen" class="center-screen hidden text-center">
        <div class="end-card scale-in">
            <div class="icon-large">🏆</div>
            <h1 class="title">اكتمل المخطط!</h1>
            <p class="subtitle">لقد أنهيت التحدي بنجاح</p>
            <div class="results-grid">
                <div class="result-box"><h3>⏱ الزمن</h3><p id="final-time">00:00</p></div>
                <div class="result-box"><h3>❌ الأخطاء</h3><p id="final-errors">0</p></div>
            </div>
            <button id="restart-btn" class="btn-primary">إعادة اللعب</button>
        </div>
    </section>

    <script>
        // ==========================================
        // قاعدة الأسئلة
        // ==========================================
        const questions = [
            { question: "يرمز لعنصر الباريوم بالرمز...", options: ["Ba", "Ca", "Bi", "Pb"], answer: 0 },
            { question: "عند اتحاد الباريوم مع الكلور يتكون...", options: ["BaCl3", "Ba2Cl", "BaCl", "BaCl2"], answer: 3 },
            { question: "يرمز لعنصر البوتاسيوم بالرمز...", options: ["K", "Ca", "C", "Ka"], answer: 0 },
            { question: "عند اتحاد البوتاسيوم مع البروم...", options: ["KBr", "CaBr2", "KBr2", "BaBr2"], answer: 0 },
            { question: "يرمز لعنصر الفلور بالرمز...", options: ["F", "V", "Fa", "FO"], answer: 0 },
            { question: "عند اتحاد الفلور مع الصوديوم...", options: ["NaF2", "CaF2", "Na2F", "NaF"], answer: 3 },
            { question: "الرمز S يرمز لعنصر...", options: ["الفوسفور", "الكبريت", "الزرنيخ", "السيلينيوم"], answer: 1 },
            { question: "الرمز Fe يرمز لعنصر...", options: ["الفوسفور", "الكبريت", "الحديد", "الزرنيخ"], answer: 2 },
            { question: "عند اتحاد الأكسجين مع الألومنيوم...", options: ["AlO3", "Al2O3", "Al2O2", "AlO2"], answer: 1 },
            { question: "العنصر الذي عدده الذري 12 هو...", options: ["Na", "Mg", "Al", "Ca"], answer: 1 },
            { question: "يرمز لعنصر الخارصين...", options: ["Zn", "Za", "ZN", "Sn"], answer: 0 },
            { question: "Au هو...", options: ["الفضة", "النحاس", "الكالسيوم", "الذهب"], answer: 3 },
            { question: "Hg هو...", options: ["الفضة", "الزئبق", "الكالسيوم", "الحديد"], answer: 1 },
            { question: "يسمى المركب Cu₂Cl₂", options: ["كلوريد النحاس I", "كلوريد النحاس II", "كلوريد النحاسيك", "كلوريد البوتاسيوم"], answer: 0 }
        ];

        let currentQuestions = [];
        let errors = 0;
        let timeElapsed = 0;
        let timerInterval = null;
        let isMuted = false;
        let isAnimating = false; 

        // ==========================================
        // نظام الصوت المدمج
        // ==========================================
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (isMuted) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();

            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            if (type === 'correct') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start(); osc.stop(audioCtx.currentTime + 0.3);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.3);
                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                osc.start(); osc.stop(audioCtx.currentTime + 0.4);
            } else if (type === 'win') {
                const notes = [400, 500, 600, 800];
                notes.forEach((freq, i) => {
                    const oscWin = audioCtx.createOscillator();
                    const gainWin = audioCtx.createGain();
                    oscWin.type = 'triangle'; oscWin.frequency.value = freq;
                    oscWin.connect(gainWin); gainWin.connect(audioCtx.destination);
                    const startTime = audioCtx.currentTime + (i * 0.1);
                    gainWin.gain.setValueAtTime(0.2, startTime);
                    gainWin.gain.exponentialRampToValueAtTime(0.01, startTime + 0.3);
                    oscWin.start(startTime); oscWin.stop(startTime + 0.3);
                });
            }
        }

        // ==========================================
        // منطق اللعبة ورسم الشجرة (Tree Rendering)
        // ==========================================
        
        function shuffleArray(array) {
            let shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        function formatTime(seconds) {
            const m = Math.floor(seconds / 60).toString().padStart(2, '0');
            const s = (seconds % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        function updateTimer() {
            timeElapsed++;
            document.getElementById('timer').textContent = formatTime(timeElapsed);
        }

        function startQuiz() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            currentQuestions = shuffleArray(questions);
            errors = 0; timeElapsed = 0;
            
            document.getElementById('error-count').textContent = errors;
            document.getElementById('timer').textContent = "00:00";
            document.getElementById('total-q-num').textContent = currentQuestions.length;
            
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('end-screen').classList.add('hidden');
            
            document.getElementById('top-bar').classList.remove('hidden');
            document.getElementById('quiz-screen').style.display = 'block';
            
            const treeRoot = document.getElementById('tree-root');
            treeRoot.innerHTML = '';
            
            clearInterval(timerInterval);
            timerInterval = setInterval(updateTimer, 1000);
            
            isAnimating = false;
            renderQuestionNode(0, treeRoot);
        }

        function renderQuestionNode(qIndex, parentElement) {
            if (qIndex >= currentQuestions.length) return;
            
            // تحديث شريط التقدم
            document.getElementById('current-q-num').textContent = qIndex + 1;
            const progressPercent = (qIndex / currentQuestions.length) * 100;
            document.getElementById('progress-bar').style.width = `${progressPercent}%`;

            const q = currentQuestions[qIndex];
            
            // حاوية المستوى
            const levelDiv = document.createElement('div');
            levelDiv.className = 'tree-level scale-in';
            
            // صندوق السؤال (الألوان 0, 2, 4, 6)
            const qBox = document.createElement('div');
            qBox.className = `node-box q-node color-${(qIndex * 2) % 7}`;
            qBox.innerHTML = q.question;
            
            // الخط النازل للخيارات
            const vLine = document.createElement('div');
            vLine.className = 'connector-line-vertical';
            
            // صف الخيارات
            const optsRow = document.createElement('div');
            optsRow.className = 'options-row';
            
            q.options.forEach((optText, optIndex) => {
                const optWrapper = document.createElement('div');
                optWrapper.className = 'option-wrapper';
                
                const btn = document.createElement('button');
                // ألوان أزرار مختلفة (1, 3, 5, الخ)
                btn.className = `node-box opt-btn color-${(qIndex + optIndex + 1) % 7}`;
                btn.innerHTML = `${optText}`;
                
                btn.onclick = () => handleAnswerClick(optIndex, qIndex, btn, optWrapper);
                
                optWrapper.appendChild(btn);
                optsRow.appendChild(optWrapper);
            });
            
            levelDiv.appendChild(qBox);
            levelDiv.appendChild(vLine);
            levelDiv.appendChild(optsRow);
            
            parentElement.appendChild(levelDiv);
            
            // السحب التلقائي (Scroll) للكاميرا لتوسيط العقدة الجديدة
            setTimeout(() => {
                qBox.scrollIntoView({ behavior: 'smooth', block: 'center', inline: 'center' });
            }, 100);
        }

        function handleAnswerClick(selectedIndex, qIndex, btnElement, optionWrapper) {
            if (isAnimating) return;
            isAnimating = true;
            
            const isCorrect = (selectedIndex === currentQuestions[qIndex].answer);
            
            // تعطيل باقي الأزرار في نفس الصف
            const siblings = optionWrapper.parentElement.querySelectorAll('.opt-btn');
            siblings.forEach(b => {
                b.disabled = true;
                if (b !== btnElement) b.style.opacity = '0.5';
            });
            
            if (isCorrect) {
                playSound('correct');
                btnElement.classList.add('correct');
                btnElement.innerHTML += ' ✔';
                
                if (qIndex + 1 === currentQuestions.length) {
                    document.getElementById('current-q-num').textContent = currentQuestions.length;
                    document.getElementById('progress-bar').style.width = `100%`;
                    setTimeout(endQuiz, 1000);
                } else {
                    setTimeout(() => {
                        // إضافة خط نازل من الإجابة الصحيحة للسؤال الجديد
                        const dropLine = document.createElement('div');
                        dropLine.className = 'connector-line-vertical fade-in';
                        optionWrapper.appendChild(dropLine);
                        
                        // رندر السؤال التالي بداخل خيار الإجابة (لإنشاء فرع جديد)
                        renderQuestionNode(qIndex + 1, optionWrapper);
                        isAnimating = false;
                    }, 600);
                }
            } else {
                playSound('wrong');
                btnElement.classList.add('wrong');
                btnElement.classList.add('shake');
                
                errors++;
                document.getElementById('error-count').textContent = errors;
                
                const wrongMsg = document.getElementById('wrong-msg');
                wrongMsg.classList.remove('hidden');
                wrongMsg.style.animation = 'none';
                void wrongMsg.offsetWidth; // ريفريش للأنيميشن
                wrongMsg.style.animation = 'fadeInOut 1.5s forwards';
                
                setTimeout(() => {
                    wrongMsg.classList.add('hidden');
                    // انهيار الشجرة والعودة للبداية
                    const treeRoot = document.getElementById('tree-root');
                    treeRoot.innerHTML = '';
                    document.getElementById('progress-bar').style.width = `0%`;
                    
                    isAnimating = false;
                    renderQuestionNode(0, treeRoot);
                }, 1500);
            }
        }

        function endQuiz() {
            clearInterval(timerInterval);
            playSound('win');
            
            document.getElementById('quiz-screen').style.display = 'none';
            document.getElementById('top-bar').classList.add('hidden');
            
            document.getElementById('end-screen').classList.remove('hidden');
            
            document.getElementById('final-time').textContent = formatTime(timeElapsed);
            document.getElementById('final-errors').textContent = errors;
        }

        // ==========================================
        // الأحداث (Events)
        // ==========================================
        document.getElementById('start-btn').addEventListener('click', startQuiz);
        document.getElementById('restart-btn').addEventListener('click', startQuiz);

        const muteBtn = document.getElementById('mute-btn');
        muteBtn.addEventListener('click', () => {
            isMuted = !isMuted;
            muteBtn.textContent = isMuted ? '🔇' : '🔊';
            muteBtn.style.background = isMuted ? 'rgba(239, 68, 68, 0.5)' : '';
        });

    </script>
</body>
</html>
